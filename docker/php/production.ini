; Production PHP settings for the app and worker containers.
; Loaded after the image defaults because of the "zz-" prefix.
;
; Uploads: a job application requires a CV (max 10 MB) and a portfolio (max
; 30 MB), each as a single file. post_max_size must cover both plus form
; overhead, and nginx's client_max_body_size mirrors it.

upload_max_filesize = 32M
post_max_size = 64M
max_file_uploads = 10

memory_limit = 256M
max_execution_time = 60
max_input_time = 120

date.timezone = Asia/Jakarta

expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

realpath_cache_size = 4096K
realpath_cache_ttl = 600
