; Production PHP settings for the app and worker containers.
; Loaded after the image defaults because of the "zz-" prefix.
;
; Uploads: job application documents allow 5 files x 5 MB, so the container
; defaults (upload_max_filesize=2M, post_max_size=8M) would reject valid forms.

upload_max_filesize = 10M
post_max_size = 30M
max_file_uploads = 10

memory_limit = 256M
max_execution_time = 60
max_input_time = 60

date.timezone = Asia/Jakarta

expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

realpath_cache_size = 4096K
realpath_cache_ttl = 600
